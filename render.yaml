services:
  - type: web
    name: fca-rag-api
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    # This service can validate and answer deterministic questions from the
    # bundled index. Ollama is not provided by Render's free web service, so
    # evidence synthesis requires a separately reachable, user-managed Ollama.
    envVars:
      - key: LLM_MODEL
        value: llama3.2:3b
      - key: TOP_K
        value: "3"
      - key: RETRIEVAL_K
        value: "15"
      - key: MIN_RELEVANCE
        value: "0.25"